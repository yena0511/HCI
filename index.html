<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1311">
<title>디지털 도슨트 플랫폼</title>
<!--
  통합 도슨트 플랫폼 엔진(platform-engine-template.html) — 제작 · 조준동 Humartology Lab.
  · 전시의 모든 작품이 같은 화면 · 같은 조작을 씁니다. 작품마다 달라지는 것은 콘텐츠(JSON)뿐입니다.
  · 공통 핵심: 작품 보기(부위 가리키기 · 밝히기 · 확대 · 겹쳐 그리기) · 음성(자연스러운 목소리 · 속도 · 자막)
               · 근거 있는 질문(확실성 · 출처 · 자료에 없으면 추측하지 않음) · 같은 자리의 이전/다음 · 관람 기록
  · 기능 모듈(platform.features로 켬): tour 해설 · gaze 시선 · lens 렌즈 · compare 바꿔 보기/견주어 보기
               · access 관람 방식 · route 찾아가기와 도착 확인 · cards 카드 도감 · 덱 · 배틀
-->
<style>
:root{ --ink:#eef2ee; --muted:#a6b3ab; --acc:#9fd9c0; --gold:#e8c46a; --bg:#0f1311; --panel:#18201c; --panel2:#1f2924; --line:rgba(159,217,192,.26); --fs:1; --red:#f08a7a; }
*{box-sizing:border-box;}
[hidden]{display:none !important;}
html,body{margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif; overflow:hidden; font-size:calc(16px * var(--fs));}
body.lowvision{ --ink:#fff; --muted:#eef3ef; --line:rgba(255,224,102,.75); --acc:#ffe066; }
button{font-family:inherit; color:inherit; cursor:pointer; font-size:inherit;}
button:focus-visible,input:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid #fff; outline-offset:2px;}
[tabindex="-1"]:focus{outline:none;}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);}
p{line-height:1.6; word-break:keep-all; margin:.35em 0;}
h1,h2,h3{word-break:keep-all; margin:.2em 0;}
.note{font-size:.8rem; color:var(--muted); line-height:1.55;}
.eyebrow{font-size:.72rem; letter-spacing:.12em; color:var(--acc); font-weight:800; margin:.5em 0 .2em;}
.chip{white-space:nowrap; border:1px solid var(--line); background:rgba(15,19,17,.88); border-radius:999px; padding:6px 11px; font-size:.8rem; font-weight:700; min-height:36px;}
.btn{border:1px solid var(--line); background:var(--panel2); border-radius:14px; padding:11px 14px; font-weight:800; min-height:48px;}
.btn.pri{background:var(--acc); color:#10231b; border-color:var(--acc);}
.btn.gold{background:var(--gold); color:#2a1e00; border-color:var(--gold);}
.btn:disabled{opacity:.4;}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.tag{display:inline-block; font-size:.66rem; font-weight:800; padding:1px 7px; border-radius:999px; margin-right:4px; vertical-align:1px; border:1px solid currentColor;}
.tag.FACT{color:#8fd19e;} .tag.INTERPRETATION{color:#f0c86a;} .tag.DEBATED,.tag.ESTIMATE{color:#f0a36a;} .tag.UNKNOWN,.tag.FICTION{color:var(--red);} .tag.TOLD,.tag.COMPARE{color:#9fc3f0;}
#top{position:fixed; top:0; left:0; right:0; z-index:30; height:calc(52px + env(safe-area-inset-top,0px)); display:flex; align-items:center; gap:5px; padding:env(safe-area-inset-top,0px) 8px 0; background:rgba(15,19,17,.96); border-bottom:1px solid var(--line);}
#brand{flex:1; min-width:0; text-align:left; background:none; border:0; padding:0 2px; font-weight:900; font-size:.95rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
#brand small{display:block; font-weight:600; font-size:.7rem; color:var(--muted); overflow:hidden; text-overflow:ellipsis;}
.screen{position:fixed; left:0; right:0; top:calc(52px + env(safe-area-inset-top,0px)); bottom:0; overflow:auto; display:none;}
.screen.on{display:block;}
.wrap{max-width:900px; margin:0 auto; padding:14px 16px 40px;}
/* 입구 · 지도 */
.hero h1{font-size:1.7rem; line-height:1.25;} .hero .sub{color:var(--gold); font-weight:800;}
.grid{display:grid; gap:8px; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); margin:8px 0;}
.opt{text-align:left; border:1px solid var(--line); background:var(--panel); border-radius:14px; padding:11px 13px; min-height:58px;}
.opt[aria-pressed="true"]{border-color:var(--gold); box-shadow:0 0 0 2px var(--gold) inset; background:#2a2614;}
.opt b{display:block;} .opt span{font-size:.8rem; color:var(--muted);}
.feat{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px; font-size:.84rem;}
.feat b{color:var(--acc);}
#hall{width:100%; max-width:640px; display:block; margin:6px auto; background:#141b17; border:1px solid var(--line); border-radius:14px; touch-action:manipulation;}
.wcard{display:flex; gap:12px; align-items:center; text-align:left; width:100%; border:1px solid var(--line); background:var(--panel); border-radius:16px; padding:10px; margin:8px 0;}
.wcard img{width:64px; height:80px; object-fit:contain; background:#fff; border-radius:10px; flex:none;}
.wcard .tx{flex:1; min-width:0;} .wcard b{display:block; font-size:1.02rem;} .wcard .m{font-size:.78rem; color:var(--muted);}
.badge{display:inline-flex; align-items:center; gap:3px; border-radius:999px; padding:2px 8px; font-size:.72rem; font-weight:800; border:1px solid var(--line); margin:3px 3px 0 0;}
.badge.ok{background:#1d3a2d; color:#bff0d6; border-color:#4fa27c;} .badge.wait{background:#2e2a17; color:#f1dc9a; border-color:#8f7b35;}
/* 작품 화면 */
#art{position:fixed; left:0; right:0; top:calc(52px + env(safe-area-inset-top,0px)); height:42vh; overflow:hidden; background:#fff; touch-action:none;}
body.dark-art #art{background:#0b0d0c;}
.pane{position:absolute; top:0; bottom:0; left:0; right:0; overflow:hidden;}
#art.split #paneA{right:50%;} #art.split #paneB{left:50%; border-left:2px solid var(--gold);}
.pin{position:absolute; transform-origin:0 0; transition:transform .85s cubic-bezier(.2,.7,.2,1);}
.pin img,.pin canvas{display:block; width:100%; height:100%; user-select:none; -webkit-user-drag:none; position:absolute; inset:0;}
.pin svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none;}
.hl{transition:opacity .6s; opacity:0;} .hl.on{opacity:1;}
.ring{fill:none; stroke:var(--gold); stroke-width:.7; vector-effect:non-scaling-stroke; transition:all .85s cubic-bezier(.2,.7,.2,1);}
body.lowvision .ring{stroke:#ffe066; stroke-width:1.6;}
.pin.zoomed .rdot{display:none;}
.rdot{fill:rgba(232,196,106,.25); stroke:#e8c46a; stroke-width:1.4; vector-effect:non-scaling-stroke; pointer-events:all; cursor:pointer;}
.rdot.seen{fill:rgba(143,209,158,.25); stroke:#8fd19e;}
.ovl line,.ovl polyline{fill:none; stroke:#ffe38a; stroke-width:1.6; vector-effect:non-scaling-stroke; filter:drop-shadow(0 0 2px #ffcf4a);}
.ovl circle.st{fill:#fff6c8;} .ovl circle.rg{fill:none; stroke:#ffe38a; stroke-width:1.4; vector-effect:non-scaling-stroke; stroke-dasharray:3 2;}
.ovl text{fill:#fff; font-weight:800; paint-order:stroke; stroke:#000; stroke-width:.5px; font-family:inherit;}
.ovl .band{fill:none; stroke:rgba(190,215,255,.45); stroke-linecap:round;} .ovl .area{fill:rgba(255,227,138,.28); stroke:#ffe38a; stroke-width:1; vector-effect:non-scaling-stroke;}
.plabel{position:absolute; left:6px; top:6px; z-index:3; font-size:.7rem; font-weight:800; background:rgba(15,19,17,.82); color:#fff; border-radius:6px; padding:3px 7px; max-width:calc(100% - 12px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.plabel.virt{background:#6b3fa0;}
#peek{position:absolute; right:6px; bottom:6px; z-index:4; font-size:.72rem; font-weight:800; background:rgba(15,19,17,.85); color:#fff; border-radius:8px; padding:6px 9px; border:1px solid #fff5;}
#ptr{position:absolute; left:0; top:0; width:44px; height:44px; margin:-4px 0 0 -4px; pointer-events:none; transition:transform .85s cubic-bezier(.3,.8,.2,1), opacity .4s; opacity:0; z-index:6; filter:drop-shadow(0 2px 4px rgba(0,0,0,.6));}
#ptr.on{opacity:1;}
#ptr .ping{position:absolute; left:-10px; top:-10px; width:28px; height:28px; border-radius:50%; border:3px solid var(--gold); animation:ping 1.4s infinite;}
@keyframes ping{0%{transform:scale(.6); opacity:1;} 100%{transform:scale(1.8); opacity:0;}}
#ptag{position:absolute; z-index:7; background:rgba(0,0,0,.78); color:#fff; font-size:.74rem; font-weight:800; padding:3px 8px; border-radius:6px; pointer-events:none; transition:all .85s cubic-bezier(.3,.8,.2,1); opacity:0; white-space:nowrap;}
#ptag.on{opacity:1;}
#ptag small{display:block; font-weight:600; color:#ffe38a;}
#artnote{position:absolute; left:6px; bottom:6px; z-index:5; font-size:.66rem; color:#333; background:rgba(255,255,255,.82); padding:2px 7px; border-radius:6px; max-width:60%;}
#zoomBtn{position:absolute; right:6px; top:6px; z-index:6;}
#art.split #zoomBtn{display:none;}
#reticle{position:absolute; left:50%; top:50%; width:58px; height:58px; margin:-29px 0 0 -29px; border-radius:50%; z-index:8; pointer-events:none; display:none; background:conic-gradient(var(--gold) calc(var(--p,0)*360deg), rgba(20,20,20,.55) 0); -webkit-mask:radial-gradient(circle, transparent 24px, #000 25px); mask:radial-gradient(circle, transparent 24px, #000 25px);}
#reticle::after{content:''; position:absolute; left:50%; top:50%; width:6px; height:6px; margin:-3px; border-radius:50%; background:#fff; box-shadow:0 0 0 2px #000;}
#art.gazing #reticle{display:block;}
#heat{position:absolute; inset:0; pointer-events:none; z-index:2;}
#panel{position:fixed; left:0; right:0; top:calc(52px + 42vh + env(safe-area-inset-top,0px)); bottom:0; display:flex; flex-direction:column; border-top:1px solid var(--line); background:var(--bg);}
#tabs{display:flex; gap:4px; padding:6px 8px 4px; overflow-x:auto; flex:none; scrollbar-width:none;}
#tabs::-webkit-scrollbar{display:none;}
#tabs button{flex:1 0 auto; min-width:68px; border:1px solid var(--line); background:transparent; border-radius:12px; padding:5px 9px; font-weight:800; font-size:.86rem; line-height:1.2;}
#tabs button small{display:block; font-size:.62rem; font-weight:600; color:var(--muted);}
#tabs button[aria-selected="true"]{background:var(--acc); color:#10231b; border-color:var(--acc);}
#tabs button[aria-selected="true"] small{color:#24463a;}
#scroll{flex:1; overflow-y:auto; padding:6px 14px 10px;}
.status{display:flex; flex-wrap:wrap; gap:4px; margin:0 0 6px;}
.steps{display:flex; gap:3px; margin:4px 0 6px;} .steps i{flex:1; height:5px; border-radius:3px; background:#2c3832;} .steps i.done{background:var(--acc);} .steps i.now{background:var(--gold);}
.cap{font-size:1.06rem; line-height:1.68; word-break:keep-all;}
.cap span{color:#6f7d75; transition:color .3s; cursor:pointer;} .cap span.now{color:#fff; background:rgba(232,196,106,.16); border-radius:4px;} .cap span.past{color:#c9d3cd;}
body.lowvision .cap span{color:#dfe6e1;}
.srcs{display:flex; flex-wrap:wrap; gap:5px; margin-top:6px;}
.srcs a{font-size:.7rem; color:var(--acc); border:1px solid var(--line); border-radius:999px; padding:2px 8px; text-decoration:none;}
.box{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px 12px; margin:8px 0;}
.box.task{border-color:var(--gold);}
.choices{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0;}
.choices button{border:1px solid var(--line); background:var(--panel2); border-radius:12px; padding:8px 11px; font-size:.88rem; min-height:40px;}
.choices button[aria-pressed="true"]{background:#1f3a30; border-color:var(--acc);}
.lensbar{display:flex; gap:6px; overflow-x:auto; margin:4px 0 8px; scrollbar-width:none;}
.lensbar button{flex:none; border:1px solid var(--line); background:var(--panel); border-radius:12px; padding:6px 10px; font-size:.84rem; font-weight:700;}
.lensbar button[aria-pressed="true"]{border-color:var(--gold); background:#2a2614;}
.lensbar button:disabled{opacity:.35;}
.msg{border-radius:14px; padding:10px 12px; margin:8px 0; font-size:.95rem; line-height:1.6; word-break:keep-all;}
.msg.me{background:#223047; margin-left:18%;}
.msg.bot{background:var(--panel); border:1px solid rgba(159,217,192,.2); margin-right:6%;}
.conf{display:inline-block; font-size:.68rem; font-weight:800; padding:2px 8px; border-radius:999px; margin-bottom:4px;}
.conf.high{background:rgba(143,209,158,.18); color:#8fd19e;} .conf.partial{background:rgba(240,200,106,.18); color:#f0c86a;} .conf.none{background:rgba(240,138,122,.18); color:#f08a7a;}
.sugg{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0;} .sugg button{border:1px dashed var(--line); background:transparent; border-radius:12px; padding:6px 10px; font-size:.82rem;}
#nav{display:grid; grid-template-columns:1fr auto 1fr; gap:8px; padding:7px 10px 5px; border-top:1px solid var(--line); background:#131a16; align-items:center; flex:none;}
#nav .nb{height:48px; border-radius:14px; border:1.5px solid var(--acc); background:rgba(159,217,192,.1); font-size:.98rem; font-weight:800;}
#nav .nb:disabled{opacity:.3;}
#pp{width:52px; height:52px; border-radius:50%; border:none; background:var(--gold); color:#2a2006; font-size:1.15rem; font-weight:900;}
#ask{display:flex; gap:6px; padding:5px 10px calc(7px + env(safe-area-inset-bottom,0px)); background:#131a16; flex:none;}
#ask input{flex:1; min-width:0; height:44px; border-radius:12px; border:1px solid var(--line); background:#0b0f0d; color:var(--ink); padding:0 12px; font-size:1rem;}
#ask button{min-width:44px; height:44px; border-radius:12px; border:none; font-weight:800;}
#mic{background:#23302a; font-size:1.05rem;} #mic[aria-pressed="true"]{background:#c0463a;} #send{background:var(--acc); color:#0f1311; padding:0 12px;}
@media (min-width:900px){
  #art{right:44%; height:auto; bottom:0;}
  #panel{left:56%; top:calc(52px + env(safe-area-inset-top,0px)); border-top:none; border-left:1px solid var(--line);}
}
/* 어두운 화면: 실제 작품을 보세요 */
#look{position:fixed; inset:0; z-index:80; background:#000; display:none; flex-direction:column; align-items:center; justify-content:center; color:#bbb; text-align:center; padding:24px;}
#look.on{display:flex;}
#look .circ{width:120px; height:120px; border-radius:50%; margin:18px; background:conic-gradient(#555 calc(var(--p,0)*360deg), #1a1a1a 0); -webkit-mask:radial-gradient(circle, transparent 52px, #000 53px); mask:radial-gradient(circle, transparent 52px, #000 53px);}
#look p{max-width:420px; font-size:1.05rem; color:#ddd;}
/* 카드 */
.card{position:relative; aspect-ratio:5/7; border-radius:12px; padding:8% 7%; color:#2a1e00; display:flex; flex-direction:column; font-size:.72em; box-shadow:0 4px 14px rgba(0,0,0,.4); overflow:hidden; text-align:center;}
.card .g{display:flex; justify-content:space-between; font-weight:900;}
.card .emb{flex:1; display:grid; place-items:center; font-size:3.2em; font-weight:900; font-family:serif; color:rgba(40,25,0,.85);}
.card .nm{font-weight:900; font-size:1.05em;}
.card .sts{display:flex; justify-content:space-around; font-weight:900; margin-top:4px;}
.card .at{font-size:.85em; opacity:.8;}
.card.lock{background:#232b27 !important; color:#7d8a83; border:2px dashed #3d4a43;}
.card .demo{position:absolute; top:10px; right:-26px; transform:rotate(38deg); background:#a33; color:#fff; font-size:.75em; padding:1px 30px; font-weight:800;}
.card.sel{outline:3px solid var(--acc); outline-offset:2px;}
.book{display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:10px; font-size:15px;}
.book button{border:0; background:none; padding:0;}
.book button:disabled{opacity:.4;}
.flip{perspective:900px; width:180px; margin:10px auto; font-size:22px;}
.flip .in{transition:transform .8s; transform-style:preserve-3d; transform:rotateY(180deg);}
.flip.on .in{transform:none;}
.arena{display:grid; grid-template-columns:1fr 1fr; gap:10px; font-size:15px; max-width:320px; margin:8px auto;}
.hand{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; font-size:11px;}
.hand button{border:0; background:none; padding:0;} .hand button:disabled{opacity:.3;}
.fact{margin-top:6px; font-size:.86rem; color:var(--gold);}
/* 시트 · 알림 */
.sheet{position:fixed; inset:0; z-index:60; display:none; align-items:flex-end; justify-content:center; background:rgba(0,0,0,.6);}
.sheet.on{display:flex;}
.sheet .in{width:min(640px,100%); max-height:88vh; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:18px 18px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));}
@media (min-width:700px){ .sheet{align-items:center;} .sheet .in{border-radius:18px;} }
.sheet .x{float:right;}
.vlist button{display:block; width:100%; text-align:left; border:1px solid var(--line); background:transparent; border-radius:10px; padding:9px 10px; margin:5px 0; font-size:.88rem;}
.vlist button[aria-pressed="true"]{border-color:var(--gold); background:rgba(232,196,106,.12);}
.seg{display:flex; gap:4px; flex-wrap:wrap; margin:4px 0 10px;} .seg button{border:1px solid var(--line); background:transparent; border-radius:10px; padding:7px 10px; font-weight:700;} .seg button[aria-pressed="true"]{background:var(--acc); color:#10231b;}
input[type=text],textarea{width:100%; min-height:46px; border-radius:12px; border:1px solid var(--line); background:#0e1512; color:var(--ink); padding:8px 12px; font-size:1rem; font-family:inherit;}
#toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(120px + env(safe-area-inset-bottom,0px)); z-index:70; width:min(560px,calc(100% - 24px)); background:#233128; border:1px solid var(--acc); border-radius:14px; padding:12px 14px; display:none; box-shadow:0 10px 30px rgba(0,0,0,.5);}
#toast.on{display:block;} #toast.gold{background:#2c2610; border-color:var(--gold);}
table{width:100%; border-collapse:collapse; font-size:.84rem;} td,th{padding:6px 5px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top;} th{color:var(--muted);}
.stat{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px; margin:8px 0;}
.stat div{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px;} .stat b{display:block; font-size:1.25rem; color:var(--gold);} .stat span{font-size:.76rem; color:var(--muted);}
.foot{margin-top:18px; font-size:.78rem; color:var(--muted); text-align:center;}
.heatwrap{position:relative; display:inline-block; width:150px; margin:4px 8px 4px 0; vertical-align:top;}
.heatwrap img{width:100%; display:block; border-radius:8px; background:#fff;} .heatwrap canvas{position:absolute; inset:0; width:100%; height:100%;}
</style>
</head>
<body>
<div id="live" class="sr" aria-live="polite"></div>
<header id="top">
  <button id="brand" aria-label="전시 지도로"><span id="br-t"></span><small id="br-s"></small></button>
  <button class="chip" id="b-set" aria-label="관람 방식과 소리 설정">⚙ 설정</button>
  <button class="chip" id="b-snd" aria-pressed="true" aria-label="소리 켜기/끄기">🔊</button>
  <button class="chip" id="b-cards" hidden>🎴</button>
  <button class="chip" id="b-log">기록</button>
  <button class="chip" id="b-info" aria-label="정보">ⓘ</button>
</header>

<section class="screen" id="s-entry" aria-labelledby="e-t"><div class="wrap">
  <div class="hero"><p class="eyebrow" id="e-eyebrow"></p><h1 id="e-t"></h1><p class="sub" id="e-sub"></p><p id="e-lead"></p></div>
  <div id="e-prof-wrap"><p class="eyebrow">오늘은 어떻게 볼까요?</p><div class="grid" id="e-prof" role="group" aria-label="관람 방식"></div></div>
  <button class="btn pri" id="e-go" style="width:100%">관람 시작</button>
  <p class="eyebrow" style="margin-top:20px">이 플랫폼의 기능 · 제안</p>
  <div class="grid" id="e-feat"></div>
  <p class="foot" id="e-foot"></p>
</div></section>

<section class="screen" id="s-map" aria-label="전시 지도"><div class="wrap">
  <p class="eyebrow" id="m-eyebrow">전시 지도</p>
  <p class="note" id="m-hint"></p>
  <svg id="hall" viewBox="0 0 100 60" role="img" aria-label="전시실 지도" hidden></svg>
  <div id="m-works"></div>
  <p class="foot" id="m-foot"></p>
</div></section>

</script>
<script>
const CONTENT = JSON.parse(document.getElementById('content-data').textContent);
const P = CONTENT.platform, M = CONTENT.meta;
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const QS = new URLSearchParams(location.search);
const F = new Set(P.features || []);
const BASIC = QS.get('mode') === 'basic';                 // 평가용 비교 조건: 해설과 질문만
const WX = Object.fromEntries(P.works.map(w => [w.id, w]));
const TAGN = Object.assign({ FACT: '사실', INTERPRETATION: '해석', DEBATED: '논쟁 중', ESTIMATE: '추정', UNKNOWN: '기록 없음', TOLD: '전해지는 이야기', FICTION: '이야기 장치', COMPARE: '비교' }, P.tagNames || {});
const tagH = (t) => t ? `<span class="tag ${esc(t)}">${esc(TAGN[t] || t)}</span>` : '';
const credit = (k) => { const p = (P.proposals || {})[k]; return p ? p.who : ''; };
// 작품 안 찾기 도우미
P.works.forEach(w => { w.RX = Object.fromEntries((w.regions || []).map(r => [r.id, r])); w.FX = Object.fromEntries((w.facts || []).map(f => [f.id, f])); });

// ═════ 저장(이 기기에만) ═════
function load(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
const KEY = 'plat-' + (M.id || 'v1');
const ST = Object.assign({ profile: null, fs: 1, rate: 1, voice: null, sound: true, visited: {}, tourSeen: {}, demo: false, time: {}, seenIntro: {} }, load(KEY, {}));
let LOG = load(KEY + '-log', []);
let HEAT = load(KEY + '-heat', {});                         // 작품 → [[x,y], …] 시선이 머문 점(표본)
if(QS.has('demo')) ST.demo = true;
const persist = () => { save(KEY, ST); save(KEY + '-log', LOG.slice(-800)); save(KEY + '-heat', HEAT); };
const T0 = Date.now();
function logE(type, d){ LOG.push(Object.assign({ t: Date.now(), w: cur ? cur.id : null, type }, d || {})); if(LOG.length % 5 === 0) persist(); }

// ═════ 음성: 자연스러운 한국어 음성 우선 ═════
let voices = [], seq = 0;
const vscore = (v) => (/neural|natural|premium|enhanced|online/i.test(v.name) ? 100 : 0) + (/google/i.test(v.name) ? 40 : 0) + (/yuna|sora|heami|sunhi|injoon|jimin/i.test(v.name) ? 20 : 0) + (v.localService ? 0 : 5);
function loadVoices(){ try{ voices = speechSynthesis.getVoices().filter(v => /^ko/i.test(v.lang)).sort((a, b) => vscore(b) - vscore(a)); }catch(e){ voices = []; } }
try{ speechSynthesis.onvoiceschanged = loadVoices; }catch(e){} loadVoices();
const curVoice = () => voices.find(v => v.name === ST.voice) || voices[0] || null;
function speak(t, onEnd, opt){
    const my = ++seq; t = String(t || ''); $('live').textContent = t; opt = opt || {};
    const rate = (ST.rate || 1) * (opt.rate || 1), est = Math.max(1100, t.length * 95 / rate);
    if(!ST.sound || !window.speechSynthesis || !t){ setTimeout(() => my === seq && onEnd && onEnd(), ST.sound ? 300 : est); return; }
    let ended = false; const fin = () => { if(ended || my !== seq) return; ended = true; onEnd && onEnd(); };
    try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'ko-KR'; u.rate = rate; if(opt.pitch) u.pitch = opt.pitch; const v = curVoice(); if(v) u.voice = v;
        u.onend = fin; u.onerror = (e) => { if(e.error !== 'interrupted' && e.error !== 'canceled') fin(); };
        setTimeout(() => { if(my === seq) speechSynthesis.speak(u); }, 40); }catch(e){ setTimeout(fin, est); }
    setTimeout(fin, est * 2 + 3000);
}
function hush(){ seq++; try{ speechSynthesis.cancel(); }catch(e){} }
function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }
const voiceFirst = () => ST.profile === 'blind' || ST.profile === 'congenital';
// 관람 방식에 맞는 문장: 전맹 · 생맹이면 공간 · 촉감 중심 문장(blind)을 먼저 씀
const alt = (o, k) => (voiceFirst() && o && o.blind) ? o.blind : (o ? o[k || 't'] : '');

// ═════ 화면 전환 ═════
let cur = null, mode = null, enterT = 0;
function tick(){ if(cur && enterT){ ST.time[cur.id] = (ST.time[cur.id] || 0) + (Date.now() - enterT); enterT = 0; } }
function show(id){
    if(id !== 's-work'){ tick(); hush(); stopModes(); }
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
    const f = document.querySelector(`#${id} h1, #${id} .eyebrow`); if(f){ f.setAttribute('tabindex', '-1'); try{ f.focus({ preventScroll: true }); }catch(e){} }
    $('br-s').textContent = id === 's-work' && cur ? cur.title : id === 's-cards' ? '나의 국보 카드' : id === 's-log' ? '나의 관람 기록' : id === 's-entry' ? '입구' : '전시 지도';
    persist();
}
function sheet(html, onOpen){ $('sh-body').innerHTML = html; $('sh').classList.add('on'); onOpen && onOpen($('sh-body')); setTimeout(() => { const b = $('sh-body').querySelector('button, input'); b && b.focus(); }, 50); }
function closeSheet(){ $('sh').classList.remove('on'); }
$('sh-x').onclick = closeSheet; $('sh').addEventListener('click', e => { if(e.target === $('sh')) closeSheet(); });
let toastT = null;
function toast(html, acts, gold){ $('t-msg').innerHTML = html; $('t-act').innerHTML = ''; (acts || []).concat([['닫기', null]]).forEach(([l, f]) => { const b = document.createElement('button'); b.className = 'chip'; b.textContent = l; b.onclick = () => { $('toast').classList.remove('on'); f && f(); }; $('t-act').appendChild(b); });
    $('toast').classList.toggle('gold', !!gold); $('toast').classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => $('toast').classList.remove('on'), 10000); }

// ═════ 설정: 관람 방식 · 글자 · 속도 · 목소리 ═════
function applyProfile(){
    document.body.classList.toggle('lowvision', ST.profile === 'lowvision');
    document.documentElement.style.setProperty('--fs', (ST.profile === 'lowvision' ? 1.18 : 1) * (ST.fs || 1));
    $('b-snd').textContent = ST.sound ? '🔊' : '🔇'; $('b-snd').setAttribute('aria-pressed', ST.sound);
}
function openSettings(){
    loadVoices();
    const prof = F.has('access') ? `<p class="eyebrow">관람 방식</p><div class="vlist" id="st-prof">${P.profiles.map(p => `<button data-v="${p.id}" aria-pressed="${ST.profile === p.id}"><b>${esc(p.label)}</b> — <span class="note">${esc(p.desc)}</span></button>`).join('')}</div>` : '';
    sheet(`<h2>설정</h2>${prof}
      <p class="eyebrow">글자 크기</p><div class="seg" id="st-fs">${[[1, '보통'], [1.15, '크게'], [1.3, '아주 크게']].map(([v, l]) => `<button data-v="${v}" aria-pressed="${ST.fs == v}">${l}</button>`).join('')}</div>
      <p class="eyebrow">음성 속도</p><div class="seg" id="st-rate">${[[.85, '느리게'], [1, '보통'], [1.2, '빠르게'], [1.4, '아주 빠르게']].map(([v, l]) => `<button data-v="${v}" aria-pressed="${ST.rate == v}">${l}</button>`).join('')}</div>
      <p class="eyebrow">목소리</p><p class="note">기기에 설치된 한국어 음성입니다. 자연스러운(Neural · Natural · Premium · Google) 음성을 먼저 골라 두었습니다.</p>
      <div class="vlist" id="st-voice">${voices.length ? voices.map(v => `<button data-v="${esc(v.name)}" aria-pressed="${curVoice() === v}">${esc(v.name)}${vscore(v) >= 100 ? ' · 자연스러운 음성' : ''}</button>`).join('') : '<p class="note">이 기기에서 한국어 음성을 찾지 못했습니다. 자막으로 읽어 주세요.</p>'}</div>`, (b) => {
        b.querySelectorAll('#st-prof button').forEach(x => x.onclick = () => { ST.profile = x.dataset.v; persist(); applyProfile(); b.querySelectorAll('#st-prof button').forEach(y => y.setAttribute('aria-pressed', y === x)); logE('profile', { p: ST.profile }); speak(P.profiles.find(p => p.id === ST.profile).label + ' 방식으로 안내합니다.'); if(cur) renderMode(); });
        b.querySelectorAll('#st-fs button').forEach(x => x.onclick = () => { ST.fs = +x.dataset.v; persist(); applyProfile(); b.querySelectorAll('#st-fs button').forEach(y => y.setAttribute('aria-pressed', y === x)); });
        b.querySelectorAll('#st-rate button').forEach(x => x.onclick = () => { ST.rate = +x.dataset.v; persist(); b.querySelectorAll('#st-rate button').forEach(y => y.setAttribute('aria-pressed', y === x)); speak('이 속도로 읽습니다.'); });
        b.querySelectorAll('#st-voice button').forEach(x => x.onclick = () => { ST.voice = x.dataset.v; persist(); b.querySelectorAll('#st-voice button').forEach(y => y.setAttribute('aria-pressed', y === x)); speak('이 목소리로 해설합니다.'); });
    });
}
$('b-set').onclick = openSettings;
$('b-snd').onclick = () => { ST.sound = !ST.sound; if(!ST.sound) hush(); applyProfile(); persist(); };
$('b-info').onclick = () => sheet(Object.values(CONTENT.info.html).join('') + `<p class="note">출처 · ${Object.values(P.sources || {}).map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener" style="color:var(--acc)">${esc(s.label)}</a>`).join(' · ')}</p>`);
$('brand').onclick = () => { renderMap(); show('s-map'); };

// ═════ 입구 ═════
function renderEntry(){
    $('br-t').textContent = P.title; document.title = P.title;
    $('e-eyebrow').textContent = P.eyebrow || '디지털 도슨트 통합 플랫폼'; $('e-t').textContent = P.title; $('e-sub').textContent = P.sub || ''; $('e-lead').textContent = P.lead || '';
    $('e-prof-wrap').hidden = !F.has('access');
    if(F.has('access')) $('e-prof').innerHTML = P.profiles.map(p => `<button class="opt" data-v="${p.id}" aria-pressed="${ST.profile === p.id}"><b>${esc(p.label)}</b><span>${esc(p.desc)}</span></button>`).join('');
    $('e-prof').querySelectorAll('button').forEach(b => b.onclick = () => { ST.profile = b.dataset.v; persist(); applyProfile(); $('e-prof').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); logE('profile', { p: ST.profile }); speak(P.profiles.find(p => p.id === ST.profile).label + '을 골랐습니다. 관람 시작을 누르세요.'); });
    $('e-feat').innerHTML = (P.featureList || []).map(f => `<div class="feat"><b>${esc(f.name)}</b> — ${esc(f.what)}<br><span class="note">제안 · ${esc(f.who)}</span></div>`).join('');
    $('e-foot').textContent = $('m-foot').textContent = M.credit || '';
}
$('e-go').onclick = () => { if(!ST.profile) ST.profile = 'general'; persist(); applyProfile(); renderMap(); show('s-map'); if(voiceFirst()) speak(P.mapVoice || '전시 지도입니다.'); };

// ═════ 전시 지도 · 찾아가기 · 도착 확인 ═════
const ownedCards = () => load(KEY + '-cards', {});
function workStatus(w){
    const arrived = !!ST.visited[w.id], tourN = (w.tour || []).length, seen = (ST.tourSeen[w.id] || []).length;
    return { arrived, tourDone: tourN > 0 && seen >= tourN, seen, tourN, card: !!ownedCards()[w.id] };
}
function renderMap(){
    $('m-hint').textContent = P.mapHint || '';
    const H = P.hall;
    if(F.has('route') && H){
        $('hall').hidden = false; $('hall').setAttribute('viewBox', `0 0 ${H.w} ${H.h}`);
        $('hall').innerHTML = (H.walls || []).map(r => `<rect x="${r[0]}" y="${r[1]}" width="${r[2]}" height="${r[3]}" fill="#2b3530" rx=".6"/>`).join('')
          + (H.marks || []).map(m => `<text x="${m.x}" y="${m.y}" font-size="2.4" fill="#8aa097" text-anchor="middle">${esc(m.t)}</text>`).join('')
          + `<text x="${H.entry[0]}" y="${H.entry[1] + 4}" font-size="2.4" fill="#9fd9c0" text-anchor="middle">입구</text>`
          + P.works.map((w, i) => { const s = workStatus(w); return `<g data-w="${w.id}" style="cursor:pointer" role="button" aria-label="${esc(w.title)}"><rect x="${w.pos.x - 5}" y="${w.pos.y - 3.5}" width="10" height="7" rx="1.2" fill="${s.card ? '#1d3a2d' : s.arrived ? '#2e2a17' : '#1f2924'}" stroke="${s.card ? '#8fd19e' : '#e8c46a'}" stroke-width=".4"/><text x="${w.pos.x}" y="${w.pos.y + 1}" font-size="3.4" fill="#fff" text-anchor="middle" font-weight="800">${i + 1}</text><text x="${w.pos.x}" y="${w.pos.y + 6.4}" font-size="2.3" fill="#cfd8d3" text-anchor="middle">${esc(w.short)}</text></g>`; }).join('')
          + `<circle cx="${H.entry[0]}" cy="${H.entry[1]}" r="1.4" fill="#9fd9c0"/>`;
        $('hall').querySelectorAll('[data-w]').forEach(g => g.onclick = () => openWorkSheet(WX[g.dataset.w]));
    }
    $('m-works').innerHTML = P.works.map((w, i) => { const s = workStatus(w);
        return `<button class="wcard" data-w="${w.id}"><img src="${esc(w.thumb || w.image)}" alt="" style="background:${esc(w.bg || '#fff')}"><span class="tx"><b>${i + 1}. ${esc(w.title)}</b><span class="m">${esc(w.meta || '')}</span><br>`
          + (F.has('route') ? `<span class="badge ${s.arrived ? 'ok' : 'wait'}">${s.arrived ? '✓ 도착 확인' + (ST.visited[w.id] === 'demo' ? '(시연)' : '') : '도착 전'}</span>` : '')
          + (F.has('tour') ? `<span class="badge ${s.tourDone ? 'ok' : ''}">해설 ${s.seen}/${s.tourN}</span>` : '')
          + (F.has('cards') ? `<span class="badge ${s.card ? 'ok' : ''}">${s.card ? '🎴 카드' : '🎴 카드 전'}</span>` : '') + `</span></button>`; }).join('');
    $('m-works').querySelectorAll('[data-w]').forEach(b => b.onclick = () => F.has('route') ? openWorkSheet(WX[b.dataset.w]) : openWork(b.dataset.w));
}
function openWorkSheet(w){
    const s = workStatus(w);

    const oi = B.op.splice(Math.floor(Math.random() * B.op.length), 1)[0], a = b[id], o = b[oi];
    const my = Math.round(a.atk * (1 + B.bm) - o.dfs * .6), op = Math.round(o.atk * (1 + B.bo) - a.dfs * .6);
    let res; if(my > op){ B.sm++; res = '이번 판은 <b>내가 이겼습니다</b>'; } else if(op > my){ B.so++; res = `이번 판은 <b>${esc(B.name)}</b>가 이겼습니다`; } else res = '비겼습니다';
    B.round++; const win = my >= op ? a : o;
    drawB(`${esc(a.name)} ${my} : ${op} ${esc(o.name)} — ${res}.<div class="fact">알고 보면 · ${esc(win.fact || win.summary || '')}</div>`, a, o);
    speak(`${a.name} ${my}, ${o.name} ${op}. ${res.replace(/<[^>]+>/g, '')}. 알고 보면, ${win.fact || ''}`);
    if(B.round >= 5) setTimeout(() => { const t = B.sm > B.so ? `${B.sm} 대 ${B.so}, 승리했습니다!` : B.sm < B.so ? `${B.sm} 대 ${B.so}, 아쉽게 졌습니다.` : `${B.sm} 대 ${B.so}, 무승부입니다.`; $('bt-log').innerHTML = `<b>${esc(t)}</b><div class="fact">${esc(CD.afterBattle || '')}</div>`; speak(t + ' ' + (CD.afterBattle || '')); }, 1500);
}
window.MODES_CARDS = { renderCards, cardHTML, synergy, deckCode, parseCode };
})();


// ═════ 기록 ═════
const fmtT = (ms) => { const s = Math.round((ms || 0) / 1000); return s < 60 ? s + '초' : Math.floor(s / 60) + '분 ' + (s % 60) + '초'; };
const EVL = { open: '작품 열기', mode: '감상 방법', region: '부위', step: '해설 단계', ask: '질문', answer: '답', arrive: '도착 확인', route: '찾아가기', card: '카드', lens: '렌즈', found: '관찰 과제', variant: '바꿔 보기', choice: '답 고르기', pair: '견주어 보기', brief: '시선 · 짧은 해설', more: '시선 · 자세한 해설', link: '시선 · 비교 연결', look_end: '실제 작품 보기', peek: '원본 엿보기', profile: '관람 방식', battle: '배틀' };
function evText(e){ let s = EVL[e.type] || e.type; const w = WX[e.w];
    if(e.type === 'answer') s += ` · ${CONF[e.conf] || '안내'}`; else if(e.type === 'ask') s += ` “${e.q}”`; else if(e.type === 'mode') s += ` · ${MODES[e.m] ? MODES[e.m].label : e.m}`;
    else if(e.type === 'look_end') s += ` ${e.s}초`; else if(e.type === 'found') s += e.found ? ' · 찾았어요' : ' · 잘 모르겠어요';
    else if(e.r && w && w.RX[e.r]) s += ` · ${w.RX[e.r].label}`; else if(e.id) s += ` · ${WX[e.id] ? WX[e.id].title : e.id}`; else if(e.v) s += ` · ${e.v}`; else if(e.i != null) s += ` ${e.i + 1}`;
    return s + (w ? ` · ${w.short}` : ''); }
function renderLog(){
    tick(); if(cur && $('s-work').classList.contains('on')) enterT = Date.now();
    const asks = LOG.filter(e => e.type === 'ask').length, total = Object.values(ST.time).reduce((a, b) => a + b, 0);
    const looks = LOG.filter(e => e.type === 'look_end').reduce((a, e) => a + e.s, 0);
    const confs = LOG.filter(e => e.type === 'answer' && e.conf).reduce((a, e) => (a[e.conf] = (a[e.conf] || 0) + 1, a), {});
    $('l-stat').innerHTML = [[P.works.filter(w => workStatus(w).tourDone).length + '/' + P.works.length, '해설을 끝까지 본 작품'], [fmtT(total), '작품 화면에 머문 시간'], [looks + '초', '화면 대신 실제 작품을 본 시간'], [asks, '물어본 질문']]
        .concat(F.has('cards') ? [[Object.keys(ownedCards()).length + '/' + cardList().length, '얻은 카드']] : [])
        .map(([b, s]) => `<div><b>${b}</b><span>${s}</span></div>`).join('') + (Object.keys(confs).length ? `<div><b style="font-size:.95rem">${Object.entries(confs).map(([k, v]) => `${CONF[k].split(' · ')[0]} ${v}`).join(' · ')}</b><span>답의 확실성</span></div>` : '');
    $('l-heat').innerHTML = F.has('gaze') ? `<p class="eyebrow">시선이 머문 곳</p>` + P.works.filter(w => (HEAT[w.id] || []).length).map(w => `<span class="heatwrap"><img src="${esc(w.image)}" alt="${esc(w.title)}" style="background:${esc(w.bg || '#fff')}"><canvas data-w="${w.id}" width="150" height="${Math.round(150 * w.imgH / w.imgW)}"></canvas></span>`).join('') || '<p class="note">아직 시선 기록이 없습니다.</p>' : '';
    $('l-heat').querySelectorAll('canvas').forEach(cv => { const g = cv.getContext('2d'), pts = HEAT[cv.dataset.w] || []; pts.forEach(p => { const x = p[0] / 100 * cv.width, y = p[1] / 100 * cv.height, gr = g.createRadialGradient(x, y, 0, x, y, 14); gr.addColorStop(0, 'rgba(255,80,40,.28)'); gr.addColorStop(1, 'rgba(255,80,40,0)'); g.fillStyle = gr; g.fillRect(x - 14, y - 14, 28, 28); }); });
    $('l-rows').innerHTML = P.works.map(w => { const n = LOG.filter(e => e.w === w.id && !['open', 'mode'].includes(e.type)).length; return `<tr><td>${esc(w.short)}${workStatus(w).tourDone ? ' ✓' : ''}</td><td>${fmtT(ST.time[w.id])}</td><td>${n ? n + '가지 행동' : '—'}</td></tr>`; }).join('');
    $('l-extra').innerHTML = Object.values(MODES).map(m => m.logHTML ? m.logHTML() : '').join('');
    $('l-tl').innerHTML = LOG.filter(e => !['mode', 'open'].includes(e.type)).slice(-50).map(e => `<li>${esc(evText(e))}</li>`).join('') || '<li>아직 기록이 없습니다.</li>';
}
$('b-log').onclick = () => { renderLog(); show('s-log'); };
$('l-exp').onclick = () => { renderLog(); const data = { platform: P.title, exportedAt: new Date().toISOString(), condition: BASIC ? 'basic' : 'full', profile: ST.profile, visited: ST.visited, tourSeen: ST.tourSeen, timeMs: ST.time, cards: F.has('cards') ? ownedCards() : undefined, gaze: HEAT, events: LOG };
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' })); a.download = (M.id || 'docent') + '-record.json'; document.body.appendChild(a); a.click(); a.remove(); };
$('l-reset').onclick = () => { if(!confirm('관람 기록을 지울까요? (카드는 카드 화면에서 따로 지웁니다)')) return; LOG = []; HEAT = {}; ST.visited = {}; ST.tourSeen = {}; ST.time = {}; ST.seenIntro = {}; persist(); renderLog(); };
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ closeSheet(); } });
document.addEventListener('visibilitychange', () => { if(document.hidden){ tick(); persist(); } else if(cur && $('s-work').classList.contains('on')) enterT = Date.now(); });

// ═════ 시작 ═════
renderEntry(); applyProfile();
(() => {
    const w = QS.get('work'), code = (QS.get('code') || '').toUpperCase();
    if(w && WX[w]){ if(!ST.profile) ST.profile = 'general'; applyProfile(); if(F.has('route') && (code === String(WX[w].code).toUpperCase() || (code && ST.demo))) arrive(WX[w], ST.demo ? 'demo' : 'code'); openWork(w); return; }
    if(ST.profile){ renderMap(); show('s-map'); } else { show('s-entry'); if(P.welcomeVoice) setTimeout(() => speak(P.welcomeVoice), 500); }
})();
window.__dbg = { ST, get LOG(){ return LOG; }, MODES, WX, openWork, setMode, ask, localAnswer, get cur(){ return cur; }, get mode(){ return mode; }, point };
</script>
